- id: TODO-1-004
  content: "创建v2.2.11详细设计文档\n\n【依据】\n- 概要设计: docs/02-design/OUTLINE_v2.2.11.md\n-\
    \ 需求文档: docs/01-requirements/requirements_v2.2.11.md\n\n【Skill规范 - 核心原则】\n\n1.\
    \ 功能模块→技术模块映射：\n   - 将概要设计的\"功能模块\"映射为技术实现的\"技术模块\"\n   - 关注类设计、函数签名、数据结构\n\n\
    2. 代码级设计必须包含：\n   - 类设计：类名、属性、方法签名\n   - 接口设计：函数签名、参数、返回值\n   - 数据结构：JSON/YAML完整Schema\n\
    \   - 异常处理：异常类型、错误码\n   - 测试策略：单元测试、E2E测试\n\n【必须章节】\n✅ 1. 功能模块映射 (功能→技术模块)\n✅\
    \ 2. 技术架构 (模块划分、技术选型)\n✅ 3. 核心模块设计 (类/函数设计)\n✅ 4. 数据结构 (状态文件Schema)\n✅ 5. 算法与逻辑\
    \ (核心业务流程)\n✅ 6. API设计 (内部/外部接口)\n✅ 7. 错误处理 (异常场景)\n✅ 8. 测试策略 (单元/E2E测试)\n✅ 9.\
    \ 签署确认 (双人签署)\n\n【3个功能模块】\n1. F-TODO-001: Agent独立TODO编号机制\n   - 技术模块: TodoIdGenerator,\
    \ TodoStore\n   - 关键文件: src/cli/todo_commands.py, src/core/todo.py\n\n2. F-SKILL-001:\
    \ Skill强制执行+嵌入\n   - 技术模块: SkillEnforcer, SkillEmbedder\n   - 关键文件: src/cli/skill_check_commands.py,\
    \ src/core/skill.py\n\n3. F-NOTIF-001: StateNotifier Receiver\n   - 技术模块: StateReceiver,\
    \ StateQueue\n   - 关键文件: src/core/state_notifier.py, src/web/receiver.py\n\n【签署规范】\n\
    Agent2创建详细设计后，由Agent1签署"
