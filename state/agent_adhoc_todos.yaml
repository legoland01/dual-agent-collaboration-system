- id: TODO-1-006
  content: "开始v2.2.11开发阶段\n\n【依据】\n- 需求文档: docs/01-requirements/requirements_v2.2.11.md\n\
    - 概要设计: docs/02-design/OUTLINE_v2.2.11.md\n- 详细设计: docs/02-design/DETAIL_v2.2.11.md\n\
    \n【开发规范 - oc_collab_development_guide】\n\n开发前准备：\n1. 确认当前版本: oc-collab status\n\
    2. 确认设计已签署\n3. 查看详细设计文档\n4. 更新待办\n\n【开发流程】\n\n1. 开发前:\n   - [ ] 确认project_state.yaml中phase:\
    \ development\n   - [ ] 查看详细设计中的模块分解\n\n2. 模块实现顺序（按详细设计）:\n   M1: TodoIdGenerator,\
    \ TodoMigrator\n   M2: SkillEnforcerEnhanced, SkillEmbedder\n   M3: StateReceiver,\
    \ StateQueueManager\n\n3. 编码规范:\n   - 文件命名: 小写下划线 (src/core/todo_id_generator.py)\n\
    \   - 类命名: PascalCase (TodoIdGenerator)\n   - 函数命名: snake_case (generate())\n\
    \   - 异常定义: 专用异常类\n\n4. 测试要求:\n   - 单元测试覆盖 ≥ 80%\n   - 每个模块对应test_*.py\n   - 测试类命名:\
    \ TestModuleName\n\n5. 代码质量:\n   - 使用oc_collab代码规范\n   - 编写文档字符串\n   - 错误处理完善\n\
