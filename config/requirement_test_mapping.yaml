  - requirement_id: F-QUAL-002-02
    test_files:
      - tests/test_v230_bug_linker.py
    description: 每个BUG修复时自动记录关联的测试用例
  
  - requirement_id: F-QUAL-002-03
    test_files:
      - tests/test_v230_bug_linker.py
    description: 支持oc-collab bug link命令
  
  - requirement_id: F-QUAL-002-04
    test_files:
      - tests/test_v230_bug_linker.py
    description: 支持oc-collab bug list --unlinked命令
  
  - requirement_id: F-QUAL-002-05
    test_files:
      - tests/test_v230_bug_linker.py
    description: 验收时检查每个P0 BUG至少关联1个测试用例
  
  - requirement_id: F-QUAL-002-06
    test_files:
      - tests/test_v230_bug_linker.py
    description: 文档规范化：创建BUG时自动创建测试用例模板
  
  - requirement_id: F-QUAL-002-07
    test_files:
      - tests/test_v230_test_suggestion.py
    description: 创建BUG时自动建议可能关联的测试用例
  
  - requirement_id: F-QUAL-002-08
    test_files:
      - tests/test_v230_coverage_checker.py
    description: signoff时检查BUG-测试关联完整性

