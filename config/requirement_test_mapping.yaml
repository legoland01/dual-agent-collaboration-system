  # F-QUAL-001: Skill快速检索系统 (10个验收标准)
  - requirement_id: F-QUAL-001-01
    test_files:
      - tests/test_v230_skill_index.py
    description: 创建skill_index.yaml索引文件，包含≥10个Skill关键词映射
  
  - requirement_id: F-QUAL-001-02
    test_files:
      - tests/test_v230_skill_search.py
    description: 实现oc-collab skill search命令，返回匹配Skill列表
  
  - requirement_id: F-QUAL-001-03
    test_files:
      - tests/test_v230_skill_search.py
    description: 搜索结果按置信度排序
  
  - requirement_id: F-QUAL-001-04
    test_files:
      - tests/test_v230_skill_search.py
    description: 支持slice参数，搜索后进入slice界面
  
  - requirement_id: F-QUAL-001-05
    test_files:
      - tests/test_v230_skill_search.py
    description: 支持verbose参数，显示匹配关键词详情
  
  - requirement_id: F-QUAL-001-06
    test_files:
      - tests/test_v230_skill_search.py
    description: 常见查询场景命中率≥90%
  
  - requirement_id: F-QUAL-001-07
    test_files:
      - tests/test_v230_skill_index.py
    description: 索引文件加载时间<100ms
  
  - requirement_id: F-QUAL-001-08
    test_files:
      - tests/test_v230_skill_index.py
    description: 索引自动更新机制（Skill新增更新时自动同步）
  
  - requirement_id: F-QUAL-001-09
    test_files:
      - tests/test_v230_skill_search.py
    description: 自动触发提示（Agent行动时自动提示相关Skill）
  
  - requirement_id: F-QUAL-001-10
    test_files:
      - tests/test_v230_skill_search.py
    description: 异常流程处理（无匹配结果、索引文件缺失等）

  # F-QUAL-002: BUG自动关联测试系统 (8个验收标准)
  - requirement_id: F-QUAL-002-01
    test_files:
      - tests/test_v230_bug_linker.py
